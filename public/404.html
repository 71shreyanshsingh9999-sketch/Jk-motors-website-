<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JK Motors - जे. के. मोटर्स | Pre-Owned Cars Showroom</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Redirects 404 subpath hits back to root preserving path and query strings
      (function () {
        var pathSegmentsToKeep = 1; // repository name on github.io
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; background: #0B2447; color: #FFC727; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="margin-bottom: 8px;">Loading JK Motors...</h2>
      <p style="color: #ffffff; font-size: 14px;">Redirecting you to the showroom...</p>
    </div>
  </body>
</html>
